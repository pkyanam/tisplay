[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tisplay"
version = "0.1.0"
description = "Interactive remote desktop streaming over a terminal or SSH"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
dependencies = [
  "mss>=9",
  "Pillow>=10",
  "python-xlib>=0.33; sys_platform == 'linux'",
  "pynput>=1.7; sys_platform != 'linux'",
]

[project.optional-dependencies]
linux = ["python-xlib>=0.33"]
test = ["pytest>=7", "jsonschema>=4.18"]

[project.scripts]
tisplay = "tisplay.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
