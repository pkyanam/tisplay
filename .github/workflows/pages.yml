name: Publish GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Prepare static site
        run: |
          mkdir -p site/assets site/agents/reference site/schemas
          cp docs/assets/tisplay-cmux-desktop.png site/assets/
          cp -R docs/agents/. site/agents/reference/
          cp schemas/agent-v1.schema.json site/schemas/
          cp SECURITY.md site/SECURITY.md
          cp llms.txt site/llms.txt
          python3 scripts/check_site_links.py site
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
