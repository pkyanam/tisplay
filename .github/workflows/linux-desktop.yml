name: Linux desktop integration

on:
  push:
    branches: [main]
  pull_request:

jobs:
  xfce-xvfb:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install virtual desktop and test dependencies
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends xvfb xauth x11-utils xdotool xterm procps dbus-daemon xfce4-session xfce4-panel xfce4-settings xfwm4 xfdesktop4 thunar xfce4-terminal libx11-dev libxtst-dev libevdev-dev
      - name: Install tisplay
        run: python -m pip install -e '.[linux]' pytest
      - name: Run desktop integration
        run: pytest -q tests/test_virtual_desktop_integration.py
